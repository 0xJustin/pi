id = "justin.pane-node"
name = "Pane node label"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Label each agent pane (and name its agent) after the problem-tree nodes whose sessions: list it"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "name_panes.py"]

[[events]]
on = "pane.focused"
command = ["python3", "name_panes.py"]
