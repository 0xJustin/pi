id = "justin.tab-done"
name = "Tab done marker"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Prefix a tab's label with a dot while an agent in it has an unseen finished turn"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "mark_tabs.py"]

[[events]]
on = "pane.focused"
command = ["python3", "mark_tabs.py"]

[[events]]
on = "tab.focused"
command = ["python3", "mark_tabs.py"]
